apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s12
spec:
  type: NodePort
  selector:
    app: s12-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: practica-s12
spec:
  type: ClusterIP
  selector:
    app: s12-database
  ports:
    - name: sqlserver
      port: 1433
      targetPort: 1433